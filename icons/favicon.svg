<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Background -->
  <rect width="512" height="512" rx="90" fill="url(#bgNavy)"/>
  
  <!-- Subtle border outline -->
  <rect x="16" y="16" width="480" height="480" rx="76" fill="none" stroke="#3B82F6" stroke-width="4" opacity="0.3"/>

  <!-- Elegant Open Book / Newspaper Base -->
  <g transform="translate(0, 30)">
    <!-- Book Pages -->
    <path d="M256 320 C 190 285, 100 295, 75 320 L 75 190 C 105 165, 195 155, 256 185 C 317 155, 407 165, 437 190 L 437 320 C 412 295, 322 285, 256 320 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="5"/>
    <line x1="256" y1="185" x2="256" y2="320" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Text Lines on Left Page -->
    <line x1="110" y1="215" x2="220" y2="210" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="110" y1="242" x2="220" y2="237" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="110" y1="269" x2="195" y2="264" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Text Lines on Right Page -->
    <line x1="292" y1="210" x2="402" y2="215" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="292" y1="237" x2="402" y2="242" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="317" y1="264" x2="402" y2="269" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Diya of Knowledge atop Book -->
  <g transform="translate(256, 145)">
    <!-- Flame -->
    <path d="M 0 -65 C 20 -42, 16 -15, 0 -8 C -16 -15, -20 -42, 0 -65 Z" fill="#F59E0B"/>
    <path d="M 0 -50 C 10 -35, 8 -18, 0 -10 C -8 -18, -10 -35, 0 -50 Z" fill="#FEF08A"/>
    <!-- Small base bowl -->
    <path d="M -45 5 C -35 28, 35 28, 45 5 Z" fill="url(#goldAccent)"/>
  </g>

  <!-- Clean Title Ribbon -->
  <g transform="translate(256, 420)">
    <rect x="-150" y="-30" width="300" height="52" rx="14" fill="url(#goldAccent)"/>
    <text x="0" y="5" font-family="'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="28" font-weight="900" fill="#0F172A" text-anchor="middle">हिंदी ज्ञानदीप</text>
  </g>
</svg>
