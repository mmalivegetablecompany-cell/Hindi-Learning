<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#3B82F6" stroke-width="4" opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.4"/>

  <!-- Open Book Base -->
  <g transform="translate(0, 40)">
    <!-- Book Pages / Base -->
    <path d="M256 340 C 200 310, 110 320, 80 340 L 80 230 C 110 210, 200 200, 256 230 C 312 200, 402 210, 432 230 L 432 340 C 402 320, 312 310, 256 340 Z" fill="#F8FAFC" opacity="0.95" stroke="#CBD5E1" stroke-width="4"/>
    <!-- Book Spine center -->
    <line x1="256" y1="230" x2="256" y2="340" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Lines on left page -->
    <line x1="115" y1="255" x2="225" y2="250" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="115" y1="280" x2="225" y2="275" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="115" y1="305" x2="200" y2="300" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Lines on right page -->
    <line x1="287" y1="250" x2="397" y2="255" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="287" y1="275" x2="397" y2="280" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="312" y1="300" x2="397" y2="305" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Glowing Diya (दीपक) in center -->
  <g transform="translate(256, 190)">
    <!-- Glow aura -->
    <circle cx="0" cy="-40" r="70" fill="#FBBF24" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Flame (लौ) -->
    <path d="M 0 -85 C 25 -55, 20 -20, 0 -10 C -20 -20, -25 -55, 0 -85 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
    <path d="M 0 -70 C 12 -50, 10 -25, 0 -15 C -10 -25, -12 -50, 0 -70 Z" fill="#FFFBEB"/>

    <!-- Diya Bowl -->
    <path d="M -60 10 C -50 45, 50 45, 60 10 C 65 0, -65 0, -60 10 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="3"/>
    <ellipse cx="0" cy="5" rx="55" ry="12" fill="#D97706"/>
    <ellipse cx="0" cy="5" rx="45" ry="8" fill="#78350F"/>
  </g>

  <!-- Hindi Letter 'अ' prominent on the left and 'ज्ञ' on the right with golden badge feel -->
  <text x="170" y="150" font-family="'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Poppins', sans-serif" font-size="70" font-weight="900" fill="#FBBF24" text-anchor="middle" filter="url(#glow)">अ</text>
  <text x="342" y="150" font-family="'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Poppins', sans-serif" font-size="70" font-weight="900" fill="#60A5FA" text-anchor="middle" filter="url(#glow)">ज्ञ</text>

  <!-- Title Badge Bottom -->
  <g transform="translate(256, 440)">
    <rect x="-170" y="-35" width="340" height="55" rx="20" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="2"/>
    <text x="0" y="3" font-family="'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Poppins', sans-serif" font-size="30" font-weight="900" fill="#1E293B" text-anchor="middle">हिंदी ज्ञानदीप</text>
  </g>
</svg>
